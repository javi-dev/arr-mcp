name: PR image

# Publishes each pull request of this fork to the fork's own registry, so the
# build under review can be deployed by hand. Tags live in a `pr-` namespace and
# never touch `latest`, `main` or a semver tag.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

concurrency:
  group: pr-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  image:
    # A pull request from another fork gets a token that cannot push here.
    if: github.repository == 'javi-dev/arr-mcp' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Describe the build
        id: describe
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          sha=$(git rev-parse --short HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=pr-${PR_NUMBER}-${sha}" >> "$GITHUB_OUTPUT"

      # amd64 only: the one platform this fork is deployed on.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/javi-dev/arr-mcp:pr-${{ github.event.pull_request.number }}
            ghcr.io/javi-dev/arr-mcp:${{ steps.describe.outputs.version }}
          build-args: |
            ARR_MCP_VERSION=${{ steps.describe.outputs.version }}
          cache-from: type=gha,scope=amd64

      - name: Summary
        env:
          VERSION: ${{ steps.describe.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### PR image published"
            echo
            echo '```'
            echo "ghcr.io/javi-dev/arr-mcp:${VERSION}"
            echo "ghcr.io/javi-dev/arr-mcp@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
